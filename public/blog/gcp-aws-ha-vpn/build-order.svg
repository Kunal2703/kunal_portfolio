        <text class="ip mid" x="393" y="170" style="fill:#7a4a00">int 0/1 public IPs</text>
        <path class="arrow-dash" d="M690 230 C 690 160, 840 190, 840 126"></path>
        <rect x="690" y="156" width="150" height="20" rx="10" fill="#fff7e6" stroke="#f29900"></rect>
