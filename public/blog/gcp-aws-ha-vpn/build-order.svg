<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" aria-label="Swimlane: GCP steps 1, 2, 6, 7 and AWS steps 3, 4, 5. GCP interface IPs flow from step 2 into step 4; AWS endpoint IPs flow from step 5 into step 6."><style>svg text { font-family: "IBM Plex Sans", Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b2330; }
svg .h { font-family: "Bricolage Grotesque", Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 18px; }
svg .n { font-weight: 600; font-size: 13px; }
svg .s { font-size: 11px; fill: #5b6576; }
svg .ip { font-family: "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #5b6576; }
svg .ipk { font-family: "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #1b2330; font-weight: 600; }
svg .mid { text-anchor: middle; }
svg .end { text-anchor: end; }
svg .g-gcp { fill: #f8f9fa; stroke: #9aa0a6; stroke-width: 1.2; }
svg .g-region-gcp { fill: none; stroke: #9aa0a6; stroke-width: 1.2; stroke-dasharray: 6 4; }
svg .g-vpc-gcp { fill: #ffffff; stroke: #4285f4; stroke-width: 1.6; }
svg .g-subnet-gcp { fill: #e8f0fe; stroke: #aecbfa; stroke-width: 1.2; }
svg .g-aws { fill: #ffffff; stroke: #242f3e; stroke-width: 1.4; }
svg .g-region-aws { fill: none; stroke: #00a4a6; stroke-width: 1.4; stroke-dasharray: 6 4; }
svg .g-vpc-aws { fill: #ffffff; stroke: #8c4fff; stroke-width: 1.6; }
svg .g-subnet-aws { fill: #e6f6f7; stroke: #00a4a6; stroke-width: 1.2; }
svg .card { fill: #ffffff; stroke: #c3cbd7; stroke-width: 1.2; }
svg .gw-gcp { fill: #ffffff; stroke: #4285f4; stroke-width: 1.8; }
svg .gw-aws { fill: #ffffff; stroke: #8c4fff; stroke-width: 1.8; }
svg .port-gcp { fill: #4285f4; }
svg .port-aws { fill: #8c4fff; }
svg .wire { fill: none; stroke: #7d8797; stroke-width: 1.4; }
svg .wire-dash { fill: none; stroke: #7d8797; stroke-width: 1.4; stroke-dasharray: 4 4; }
svg .arrow { fill: none; stroke: #4a5465; stroke-width: 1.5; marker-end: url(#arrowhead); }
svg .arrow-dash { fill: none; stroke: #4a5465; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrowhead); }
svg .zone { fill: #fbfcfd; stroke: #d5dbe4; stroke-width: 1.2; stroke-dasharray: 2 6; }
svg .lane { fill: #f7f9fb; stroke: #e1e6ed; stroke-width: 1; }
svg .node { fill: #ffffff; stroke: #b9c2cf; stroke-width: 1.4; }
svg .node-gcp { fill: #ffffff; stroke: #4285f4; stroke-width: 1.6; }
svg .node-aws { fill: #ffffff; stroke: #8c4fff; stroke-width: 1.6; }
svg .badge { fill: #1b2330; }
svg .badge-t { fill: #ffffff; font-family: "Bricolage Grotesque", Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; text-anchor: middle; }
svg .lifeline { stroke: #b9c2cf; stroke-width: 1.2; stroke-dasharray: 4 5; }
.tunnel .line { fill: none; stroke-width: 3.2; stroke-linecap: round; transition: stroke 0.2s, opacity 0.2s; }
.tunnel.a .line { stroke: #0b8a91; }
.tunnel.b .line { stroke: #5b4fd6; }
.tunnel .flow { fill: none; stroke: #ffffff; stroke-width: 1.4; stroke-dasharray: 2 14; stroke-linecap: round; animation: flow 1.1s linear infinite; }
.tunnel .hit { fill: none; stroke: transparent; stroke-width: 18; cursor: pointer; pointer-events: stroke; }
.tunnel .pill rect { stroke-width: 1.5; fill: #ffffff; }
.tunnel.a .pill rect { stroke: #0b8a91; }
.tunnel.b .pill rect { stroke: #5b4fd6; }
.tunnel .pill text { font-family: "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
.tunnel.down .line { stroke: #d93025; stroke-dasharray: 6 6; opacity: 0.8; }
.tunnel.down .flow { display: none; }
.tunnel.down .pill rect { stroke: #d93025; }
.tunnel.down .pill text { fill: #d93025; }
.tunnel.aws-active .line { stroke-width: 5; }
@keyframes flow { to { stroke-dashoffset: -16; }
@media (prefers-reduced-motion: reduce) { .tunnel .flow { animation: none; } }</style><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5465"/></marker></defs>
        <rect class="lane" x="0" y="10" width="1080" height="140" rx="10"></rect>
        <rect class="lane" x="0" y="180" width="1080" height="140" rx="10"></rect>
        <image href="data:image/svg+xml;base64," x="14" y="20" width="20" height="20"></image>
        <text class="n" x="40" y="35">Google Cloud</text>
        <image href="data:image/svg+xml;base64," x="14" y="190" width="20" height="20"></image>
        <text class="n" x="40" y="205">AWS</text>

        <g>
          <rect class="node-gcp" x="20" y="60" width="140" height="64" rx="8"></rect>
          <circle class="badge" cx="34" cy="60" r="12"></circle><text class="badge-t" x="34" y="64">1</text>
          <text class="n mid" x="90" y="88">VPC + firewall</text><text class="s mid" x="90" y="105">gcp-vpc, allow-from-aws</text>
        </g>
        <g>
          <rect class="node-gcp" x="170" y="60" width="140" height="64" rx="8"></rect>
          <circle class="badge" cx="184" cy="60" r="12"></circle><text class="badge-t" x="184" y="64">2</text>
          <text class="n mid" x="240" y="88">Router + HA VPN</text><text class="s mid" x="240" y="105">cr-aws, ha-vpn-gw</text>
        </g>
        <g>
          <rect class="node-aws" x="320" y="230" width="140" height="64" rx="8"></rect>
          <circle class="badge" cx="334" cy="230" r="12"></circle><text class="badge-t" x="334" y="234">3</text>
          <text class="n mid" x="390" y="258">VGW + propagation</text><text class="s mid" x="390" y="275">vgw-gcp</text>
        </g>
        <g>
          <rect class="node-aws" x="470" y="230" width="140" height="64" rx="8"></rect>
          <circle class="badge" cx="484" cy="230" r="12"></circle><text class="badge-t" x="484" y="234">4</text>
          <text class="n mid" x="540" y="258">2 customer GWs</text><text class="s mid" x="540" y="275">cgw-a, cgw-b</text>
        </g>
        <g>
          <rect class="node-aws" x="620" y="230" width="140" height="64" rx="8"></rect>
          <circle class="badge" cx="634" cy="230" r="12"></circle><text class="badge-t" x="634" y="234">5</text>
          <text class="n mid" x="690" y="258">2 VPN connections</text><text class="s mid" x="690" y="275">vpn-a, vpn-b</text>
        </g>
        <g>
          <rect class="node-gcp" x="770" y="60" width="140" height="64" rx="8"></rect>
          <circle class="badge" cx="784" cy="60" r="12"></circle><text class="badge-t" x="784" y="64">6</text>
          <text class="n mid" x="840" y="88">Peer GW + tunnels</text><text class="s mid" x="840" y="105">aws-peer-gw, t0–t3</text>
        </g>
        <g>
          <rect class="node-gcp" x="920" y="60" width="140" height="64" rx="8"></rect>
          <circle class="badge" cx="934" cy="60" r="12"></circle><text class="badge-t" x="934" y="64">7</text>
          <text class="n mid" x="990" y="88">4 BGP sessions</text><text class="s mid" x="990" y="105">if-t0…t3, aws-t0…t3</text>
        </g>

